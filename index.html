<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hours Tracker</title>

  <!-- Fonts: Space Grotesk + Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Design system CSS -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- ══ Sticky header ══════════════════════════════════════════════════════ -->
  <header class="app-header" role="banner">
    <div class="app-header__inner">
      <span class="app-header__title">⏱ Hours Tracker</span>

      <nav class="app-header__nav" aria-label="Main navigation">
        <button id="btn-dashboard" class="btn btn--sm" aria-label="Dashboard">Dashboard</button>
        <button id="btn-refresh"   class="btn btn--sm" aria-label="Refresh data from GitHub">Refresh</button>
        <button id="btn-settings"  class="btn btn--sm btn--yellow" aria-label="Settings">Settings</button>
      </nav>

      <!-- Sync status indicator -->
      <div id="sync-indicator" class="sync-indicator offline" role="status" aria-live="polite">
        LOCAL ONLY
      </div>
    </div>
  </header>

  <!-- ══ Pages (hash-routed) ════════════════════════════════════════════════ -->
  <main>
    <!-- Dashboard: #/ -->
    <section id="page-dashboard" class="page" aria-label="Dashboard"></section>

    <!-- Job detail: #/job/<id> -->
    <section id="page-job" class="page" aria-label="Job Detail"></section>

    <!-- Settings: #/settings -->
    <section id="page-settings" class="page" aria-label="Settings"></section>
  </main>

  <!-- ══ Toast container ════════════════════════════════════════════════════ -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- ══ App bootstrap ══════════════════════════════════════════════════════ -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
